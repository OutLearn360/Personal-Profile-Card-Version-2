<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal Profile Card</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="profile-card">
      <img
        class="avatar"
        src="images/profile-image.jpg"
        alt="Portrait of Sarah Mitchell"
      />

      <h1 class="name">Sarah Mitchell</h1>
      <p class="role">Frontend Developer</p>

      <p class="bio">
        I design and build clean, accessible websites — and share everything I
        learn along the way.
      </p>

      <ul class="stats">
        <li class="stat">
          <span class="stat-number">128</span>
          <span class="stat-label">Projects</span>
        </li>
        <li class="stat">
          <span class="stat-number">12.4k</span>
          <span class="stat-label">Followers</span>
        </li>
        <li class="stat">
          <span class="stat-number">310</span>
          <span class="stat-label">Following</span>
        </li>
      </ul>

      <div class="actions">
        <button class="btn btn-primary" type="button">Follow</button>
        <button class="btn btn-secondary" type="button">Message</button>
      </div>

      <ul class="socials">
        <li><a class="social-link" href="#">GitHub</a></li>
        <li><a class="social-link" href="#">LinkedIn</a></li>
        <li><a class="social-link" href="#">Dribbble</a></li>
      </ul>
    </main>
  </body>
</html>
